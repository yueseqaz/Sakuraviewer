name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-package:
    name: 编译 · 测试 · 打包 (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          xcode-select -p
          swift --version

      - name: 编译（release）
        run: ./scripts/build.sh release

      - name: 运行单元测试
        run: ./scripts/test.sh

      - name: 打包 SakuraViewer.app
        run: ./scripts/package.sh

      - name: 验证产物
        run: |
          test -d dist/SakuraViewer.app
          test -f dist/SakuraViewer.app/Contents/MacOS/SakuraViewer
          codesign --verify dist/SakuraViewer.app
          test -f dist/SakuraViewer-macOS.zip

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraViewer-macOS
          path: dist/SakuraViewer-macOS.zip
          if-no-files-found: error
          retention-days: 14
